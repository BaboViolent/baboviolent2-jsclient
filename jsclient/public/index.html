<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23101318' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M32 7v16M32 41v16M7 32h16M41 32h16' stroke='%23e53935' stroke-width='7'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%232f80ed'/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play BaboViolent | Free Multiplayer Arena Shooter</title>
<meta name="description" content="Play BaboViolent, the free multiplayer top-down arena shooter, in your browser. No install required.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://play.baboviolent.net/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BaboViolent">
<meta property="og:title" content="Play BaboViolent Online">
<meta property="og:description" content="Roll into fast multiplayer arena matches directly in your browser.">
<meta property="og:image" content="https://baboviolent.net/assets/live-tdm-action.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:type" content="image/png">
<meta property="og:image:alt" content="A BaboViolent team deathmatch in progress">
<meta property="og:url" content="https://play.baboviolent.net/">
<meta property="og:locale" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Play BaboViolent Online">
<meta name="twitter:description" content="A free multiplayer top-down arena shooter you can play in your browser.">
<meta name="twitter:image" content="https://baboviolent.net/assets/live-tdm-action.png">
<meta name="twitter:image:alt" content="A BaboViolent team deathmatch in progress">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="statusTextOverlay" class="status-text-overlay" hidden aria-live="polite">
    <div id="spawnStatusText" class="spawn-status-text" hidden></div>
    <div id="spectatorStatusText" class="spectator-status-text" hidden>
      <strong>SPECTATOR</strong><span>move keys to fly, wheel to zoom</span>
    </div>
  </div>

  <div id="loading" class="boot-screen">
    <p class="boot-title">BaboViolent</p>
    <p class="boot-sub">Loading…</p>
  </div>

  <div id="intro" class="boot-screen native-intro" hidden tabindex="-1" aria-label="RnD Labs intro">
    <canvas id="introLogo" class="native-intro-logo"></canvas>
  </div>

  <!-- Menu2 — MenuSetup.cpp / CMainTab.cpp (800×600 → fullscreen) -->
  <div id="menu2" class="menu2-root" hidden>
    <div class="menu2-viewport">
      <button type="button" id="btnResume" class="menu-btn menu-resume">Resume Game</button>
      <nav id="menu2Tabs" class="menu2-tabs">
        <button type="button" data-tab="profile" class="menu-tab active">Profile</button>
        <button type="button" data-tab="browser" class="menu-tab">Game Browser</button>
        <button type="button" data-tab="editor" class="menu-tab">Map Editor</button>
        <button type="button" data-tab="options" class="menu-tab">Options</button>
        <button type="button" data-tab="credits" class="menu-tab">Credits</button>
      </nav>
      <div id="menuPanelFrame" class="menu2-panel-frame">
        <div id="panel-profile" class="menu2-panel"></div>
        <div id="panel-browser" class="menu2-panel" hidden></div>
        <div id="panel-editor" class="menu2-panel" hidden></div>
        <div id="panel-options" class="menu2-panel" hidden></div>
        <div id="panel-credits" class="menu2-panel" hidden></div>
      </div>
    </div>
  </div>

  <div id="connectOverlay" class="boot-screen" hidden>
    <p class="boot-title">Connecting</p>
    <p id="connectStatus" class="boot-sub">Opening server connection…</p>
    <button type="button" id="btnCancelConnect" class="menu-btn">Cancel</button>
  </div>

  <div id="ingameMenu" class="ig-root" hidden>
    <div id="igClientVersion" class="ig-client-version">Client version: loading · Server version: not connected</div>
    <div class="ig-header">
      <div id="igGameTitle" class="ig-game-title">Deathmatch</div>
      <div id="igGameSubtitle" class="ig-game-sub"></div>
      <div id="igMapInfo" class="ig-map-info">
        <canvas id="igMapInfoCanvas" aria-hidden="true"></canvas>
      </div>
    </div>
    <div class="ig-columns">
      <div class="ig-col ig-teams">
        <button type="button" class="menu-btn ig-btn ig-blue" data-team="0">Join blue team</button>
        <button type="button" class="menu-btn ig-btn ig-red" data-team="1">Join red team</button>
        <button type="button" class="menu-btn ig-btn" data-team="-1">Spectator</button>
        <button type="button" class="menu-btn ig-btn" id="btnAutoTeam">Auto assign team</button>
        <button type="button" class="menu-btn ig-btn" id="btnDisconnect">Disconnect</button>
        <button type="button" class="menu-btn ig-btn" id="btnMainMenu">&lt;- Main menu</button>
      </div>
      <div class="ig-col ig-weapons" id="igWeapons"></div>
      <div class="ig-col ig-melee" id="igMelee"></div>
    </div>
  </div>

  <div id="overlay" hidden>
  </div>
  <div id="sandboxMapPicker" class="sandbox-map-picker" hidden role="dialog" aria-modal="true" aria-labelledby="sandboxMapTitle">
    <div class="sandbox-map-card">
      <h1 id="sandboxMapTitle">Choose a map</h1>
      <p>Select a map to load it instantly. Press M again to close.</p>
      <div id="sandboxMapList" class="sandbox-map-list"></div>
    </div>
  </div>
  <div id="mobileSpectatorControls" class="mobile-spectator-controls" hidden aria-label="Mobile spectator controls">
    <div class="mobile-actions">
      <button type="button" id="mobileChat" aria-label="Open chat">Chat</button>
      <button type="button" id="mobileScoreboard" aria-label="Toggle scoreboard" aria-pressed="false">Scores</button>
    </div>
  </div>
  <div id="worldEditor" class="world-editor-toolbar" hidden></div>
  <input id="textInput" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false"
    aria-hidden="true" data-1p-ignore data-bwignore data-lpignore="true" data-form-type="other"
    data-protonpass-ignore="true" data-keeper-ignore="true">
  <div id="hud"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
