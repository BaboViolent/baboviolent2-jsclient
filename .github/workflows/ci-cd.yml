name: CI/CD
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm test
        working-directory: jsclient
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: zot.standouthost.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: zot.standouthost.com/standouthost/baboviolent2-jsclient:${{ github.ref_name }}
          build-args: |
            CLIENT_VERSION=${{ github.ref_name }}
      - name: Update Argo CD image tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${RELEASE_TOKEN}@github.com/standouthost/clusters.git" clusters
          sed -i "s/tag: v.*/tag: ${RELEASE_TAG}/" clusters/clusters/k3s.soh.re/applications/baboviolent2-jsclient.yaml
          cd clusters
          git config user.name "baboviolent2-jsclient-release"
          git config user.email "actions@users.noreply.github.com"
          git add clusters/k3s.soh.re/applications/baboviolent2-jsclient.yaml
          git diff --cached --quiet || git commit -m "chore(baboviolent2-jsclient): deploy ${RELEASE_TAG}"
          git push
